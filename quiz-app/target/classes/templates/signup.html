<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>Create Account</h1>

    <!-- Error tabhi dikhega jab controller ne "error" bheja ho -->
    <p class="error" th:if="${error != null}" th:text="${error}">Error message</p>

    <form th:action="@{/signup}" method="post">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName"
               th:value="${fullName}" placeholder="Enter your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               th:value="${email}" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="At least 6 characters" required>

        <button type="submit">Sign Up</button>
    </form>

    <p class="link-text">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
