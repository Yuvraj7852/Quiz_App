<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>Welcome, <span th:text="${userName}">User</span>!</h1>
    <p>Test your Java knowledge with 10 multiple-choice questions.</p>

    <p class="error" th:if="${error != null}" th:text="${error}">Error message</p>

    <a class="button" th:href="@{/quiz/start}">Start Quiz</a>
    <a class="button button-secondary" th:href="@{/logout}">Logout</a>
</div>
</body>
</html>
